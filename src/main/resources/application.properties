spring.application.name=aiup-petclinic

# Embedded H2 instead of PostgreSQL, so the application, the tests and the jOOQ
# code generation run without Docker (ADR-012). PostgreSQL mode keeps the
# migrations close to their PostgreSQL form; DATABASE_TO_LOWER must match
# jooq.codegen.db.url in pom.xml. In-memory: every start begins with an empty,
# freshly migrated database (the test classpath adds the seed data).
spring.datasource.url=jdbc:h2:mem:petclinic;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
